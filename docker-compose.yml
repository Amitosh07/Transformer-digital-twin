# Transformer Digital Twin — Full Stack Docker Compose
# simulator_README §11, §12
#
# One-command startup:
#   docker compose up
#
# Services:
#   db        — PostgreSQL 16
#   mqtt      — Eclipse Mosquitto MQTT broker
#   backend   — FastAPI backend (Person 2)
#   simulator — Synthetic telemetry generator + fault injection (Person 4)
#   frontend  — Dashboard (Person 3) — placeholder, add when ready

name: transformer-digital-twin

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DEMO_DB_USER:-transformer}
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:-transformer}
      POSTGRES_DB: ${DEMO_DB_NAME:-transformer}
    ports:
      - "127.0.0.1:${DEMO_DB_PORT:-55433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── MQTT Broker ─────────────────────────────────────────────────────
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "127.0.0.1:${DEMO_MQTT_PORT:-51885}:1883"
    volumes:
      - ./backend/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "127.0.0.1", "-t", "demo/health", "-m", "ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Backend (FastAPI) ───────────────────────────────────────────────
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${DEMO_DB_USER:-transformer}:${DEMO_DB_PASSWORD:-transformer}@db:5432/${DEMO_DB_NAME:-transformer}
      MQTT_ENABLED: "true"
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_CLIENT_ID: transformer-demo-backend
      ML_BACKEND: stub
      DEMO_RESET_ENABLED: "true"
    ports:
      - "127.0.0.1:${DEMO_HTTP_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_healthy

  # ── Simulator ───────────────────────────────────────────────────────
  simulator:
    build: ./simulator
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_started
      mqtt:
        condition: service_healthy
    # Default: stream synthetic data with MQTT
    command: ["stream", "--mqtt-host", "mqtt", "--mqtt-port", "1883",
              "--http-url", "http://backend:8000",
              "--interval", "5", "--transformer-id", "TX-001"]

volumes:
  postgres_data:
  mqtt_data:
